<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira Calc</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="calculator-container">
  <div class="calculator">
    <div class="calc-top">
      <h2>Mira Calc</h2><span>Scientific Calculator</span>
    </div>
    <input type="text" id="display" readonly>
    <div class="buttons">

      <button class="operator" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="append('(')">(</button>
      <button class="operator" onclick="append(')')">)</button>
      <button class="operator" onclick="append('/')">÷</button>

      <button onclick="append('Math.sin(')">sin</button>
      <button onclick="append('Math.cos(')">cos</button>
      <button onclick="append('Math.tan(')">tan</button>
      <button onclick="append('Math.log10(')">log</button>
      <button onclick="append('Math.log(')">ln</button>

      <button onclick="append('Math.sqrt(')">√</button>
      <button onclick="append('**')">xʸ</button>
      <button onclick="append('**2')">x²</button>
      <button onclick="append('Math.E')">e</button>
      <button onclick="append('Math.PI')">π</button>

      <button onclick="factorial()">n!</button>
      <button onclick="permutation()">nPr</button>
      <button onclick="combination()">nCr</button>
      <button onclick="append('%')">%</button>
      <button onclick="append('1/')">1/x</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('*')">×</button>
      <button class="operator" onclick="append('-')">−</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('+')">+</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('.')">.</button>
      <button onclick="append('0')">0</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
<footer>
  Mira Calc • Built by Mira
</footer>
</body>
</html>
